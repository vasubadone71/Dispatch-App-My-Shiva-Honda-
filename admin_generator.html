<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shiva Honda - Activation Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1C1C1C;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #cc0000;
            margin-bottom: 5px;
            font-size: 24px;
        }
        h2 {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
            font-weight: normal;
        }
        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #242424;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 18px;
            margin-bottom: 20px;
            box-sizing: border-box;
            text-align: center;
            letter-spacing: 2px;
            font-weight: bold;
        }
        input:focus {
            outline: none;
            border-color: #cc0000;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #cc0000;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }
        button:hover {
            background-color: #aa0000;
        }
        .result-container {
            margin-top: 30px;
            padding: 20px;
            background-color: #0a0a0a;
            border-radius: 8px;
            border: 1px dashed #444;
            display: none;
        }
        .result-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .result-code {
            color: #4CAF50;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            user-select: all;
        }
        .error {
            color: #ff4444;
            font-size: 14px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HONDA</h1>
        <h2>Admin Offline Activation Generator</h2>

        <label for="deviceId">ENTER DEVICE ID SHOWN ON APP</label>
        <input type="text" id="deviceId" placeholder="e.g. A3F8-B2C1" maxlength="9" oninput="formatInput(this)">

        <button onclick="generateCode()">GENERATE CODE</button>
        <div id="error" class="error"></div>

        <div id="resultContainer" class="result-container">
            <div class="result-label">ACTIVATION CODE:</div>
            <div id="resultCode" class="result-code"></div>
        </div>
    </div>

    <script>
        const SECRET_SALT = 'BADONE_MOTORS_MSH_BPL_2026_K9X7';

        function formatInput(input) {
            let val = input.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            if (val.length > 4) {
                val = val.substring(0, 4) + '-' + val.substring(4, 8);
            }
            input.value = val;
            
            // Hide result when user starts typing again
            document.getElementById('resultContainer').style.display = 'none';
            document.getElementById('error').style.display = 'none';
        }

        async function generateCode() {
            const deviceId = document.getElementById('deviceId').value;
            const errorDiv = document.getElementById('error');
            const resultContainer = document.getElementById('resultContainer');
            const resultCode = document.getElementById('resultCode');

            if (!deviceId || deviceId.replace(/-/g, '').length !== 8) {
                errorDiv.textContent = 'Please enter a valid 8-character Device ID.';
                errorDiv.style.display = 'block';
                resultContainer.style.display = 'none';
                return;
            }

            errorDiv.style.display = 'none';
            
            const raw = deviceId.replace(/-/g, '').toUpperCase();
            
            // Using Web Crypto API for SHA-256
            const encoder = new TextEncoder();
            const data = encoder.encode(raw + SECRET_SALT);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
            
            const part1 = hashHex.substring(0, 4);
            const part2 = hashHex.substring(4, 8);
            
            const finalCode = `MSH-${part1}-${part2}`;
            
            resultCode.textContent = finalCode;
            resultContainer.style.display = 'block';
        }
    </script>
</body>
</html>
